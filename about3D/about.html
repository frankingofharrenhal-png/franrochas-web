  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #000000;
      color: #ffffff;
      font-family: 'Space Grotesk', sans-serif;
      overflow: hidden;
    }

    iframe[src*="netlify"],
    #netlify-identity-widget,
    [data-netlify-deploy-id] {
      display: none !important;
    }

    #canvas-container {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
      touch-action: none;
    }

    /* TOP NAVIGATION */
    .main-nav {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 1000;
      padding: 35px 20px 20px 20px;
      display: flex;
      justify-content: center;
      background: linear-gradient(to bottom, rgba(0, 0, 0, 0.95) 0%, rgba(0, 0, 0, 0) 100%);
      pointer-events: auto;
    }

    .main-nav ul {
      display: flex;
      list-style: none;
      gap: 25px;
      align-items: center;
      justify-content: center;
    }

    .main-nav a {
      position: relative;
      display: inline-block;
      padding: 6px 12px;
      text-decoration: none;
      outline: none;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.80rem;
      font-weight: 500;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #ffffff;
      background: transparent;
      white-space: nowrap;
    }

    .main-nav a span {
      color: #ffffff;
      position: relative;
      z-index: 2;
    }

    .main-nav a:hover span,
    .main-nav a.active span {
      color: #000000;
    }

    .main-nav a::before {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 0%;
      background-color: #ffffff;
      z-index: 1;
      transition: height 0.25s ease;
    }

    .main-nav a:hover::before,
    .main-nav a.active::before {
      height: 100%;
    }

    /* IDENTIFICADOR DE MARCA INFERIOR */
    .hero-brand-tag {
      position: absolute;
      bottom: 35px;
      left: 40px;
      z-index: 10;
      pointer-events: none;
    }

    .brand-name {
      font-family: 'Syne', sans-serif;
      font-size: clamp(1.4rem, 2.8vw, 2.2rem);
      font-weight: 900;
      letter-spacing: -0.5px;
      text-transform: uppercase;
      color: #ffffff;
    }

    .brand-sub {
      font-family: 'Space Mono', monospace;
      font-size: 0.70rem;
      color: #00ff41;
      letter-spacing: 2px;
      text-shadow: 0 0 8px rgba(0, 255, 65, 0.7);
      margin-top: 4px;
      text-transform: uppercase;
    }

    .touch-hint {
      display: none;
    }

    /* VENTANA MODAL */
    #modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.94);
      backdrop-filter: blur(14px);
      z-index: 2000;
      display: none;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.35s ease;
    }

    #modal-content {
      background: #0d0d0d;
      border: 1px solid #262626;
      width: 92vw;
      max-width: 1250px;
      max-height: 88vh;
      display: flex;
      gap: 40px;
      padding: 40px;
      border-radius: 8px;
      color: #fff;
      position: relative;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9);
      align-items: center;
    }

    #modal-image-container {
      width: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #modal-image {
      width: 100%;
      max-height: 75vh;
      aspect-ratio: 1/1;
      object-fit: cover;
      border-radius: 4px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
    }

    #modal-info {
      width: 50%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      max-height: 75vh;
      overflow-y: auto;
      padding-right: 12px;
    }

    #modal-info::-webkit-scrollbar {
      width: 4px;
    }
    #modal-info::-webkit-scrollbar-thumb {
      background: #333;
      border-radius: 2px;
    }

    #modal-title {
      font-family: 'Syne', sans-serif;
      font-size: 2.1rem;
      font-weight: 900;
      margin-bottom: 8px;
      color: #e5b842;
      letter-spacing: -0.5px;
      line-height: 1.15;
      text-transform: uppercase;
    }

    #modal-subtitle {
      font-family: 'Space Mono', monospace;
      font-size: 0.82rem;
      color: #888;
      margin-bottom: 22px;
      letter-spacing: 1px;
      text-transform: uppercase;
      line-height: 1.4;
    }

    #modal-awards {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    #modal-awards li {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.92rem;
      line-height: 1.55;
      color: #ddd;
      border-left: 2px solid #e5b842;
      padding-left: 14px;
    }

    #modal-close {
      position: absolute;
      top: 18px;
      right: 24px;
      color: #888;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 2.4rem;
      cursor: pointer;
      border: none;
      background: none;
      line-height: 1;
      transition: color 0.2s ease;
    }

    #modal-close:hover {
      color: #fff;
    }

    @media (max-width: 768px) {
      #canvas-container {
        height: 100dvh;
      }

      .hero-brand-tag {
        bottom: 24px;
        left: 20px;
        right: 20px;
      }

      .brand-name {
        font-size: 1.45rem;
      }

      .brand-sub {
        font-size: 0.62rem;
        letter-spacing: 1.4px;
      }

      .touch-hint {
        display: block;
        font-family: 'Space Mono', monospace;
        font-size: 0.60rem;
        color: rgba(255, 255, 255, 0.55);
        letter-spacing: 1.8px;
        text-transform: uppercase;
        margin-top: 6px;
      }

      .main-nav {

      }

      .main-nav ul {
        flex-wrap: wrap;
        gap: 6px 8px;
        max-width: 100%;
      }

      .main-nav a {
        font-size: 0.66rem;
        letter-spacing: 1.5px;
        padding: 5px 8px;
      }

      #modal-overlay {
        height: 100dvh;
      }

      #modal-content {
        flex-direction: column;
        padding: 44px 20px 24px 20px;
        max-height: 88dvh;
        gap: 20px;
        overflow-y: auto;
        align-items: flex-start;

        width: 100%;
        max-height: none;

        padding-right: 0;

        max-height: 42dvh;

        font-size: 1.5rem;

        top: 10px;
        right: 16px;

    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000000);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 0, window.innerWidth <= 768 ? 10.2 : 8.5);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;
    container.appendChild(renderer.domElement);

    const pmremGenerator = new THREE.PMREMGenerator(renderer);
    pmremGenerator.compileEquirectangularShader();
    const roomEnv = new THREE.RoomEnvironment();
    scene.environment = pmremGenerator.fromScene(roomEnv).texture;

    // Iluminación
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
    scene.add(ambientLight);

    const keyLight = new THREE.DirectionalLight(0xfff3db, 3.4);
    keyLight.position.set(6, 6, 6);
    scene.add(keyLight);

    const rimLight = new THREE.DirectionalLight(0x70aaff, 2.2);
    rimLight.position.set(-6, -3, -4);
    scene.add(rimLight);

    const frontLight = new THREE.PointLight(0xffffff, 1.4, 15);
    frontLight.position.set(0, 0, 5);
    scene.add(frontLight);

    // 3. Puntos dentro del túnel
    const tunnelDotsCount = 650;
    const tunnelDotsGeometry = new THREE.BufferGeometry();
    const tunnelDotsPositions = new Float32Array(tunnelDotsCount * 3);
    const tunnelDotsVelocities = new Float32Array(tunnelDotsCount * 3);

    const tunnelInnerRadiusMin = 1.0;
    const tunnelInnerRadiusMax = 3.9;
    const tunnelHeightRange = 12.0;

    for (let i = 0; i < tunnelDotsCount; i++) {
      const angle = Math.random() * Math.PI * 2;
      const r = tunnelInnerRadiusMin + Math.random() * (tunnelInnerRadiusMax - tunnelInnerRadiusMin);
      const x = Math.sin(angle) * r;
      const z = Math.cos(angle) * r;
      const y = (Math.random() - 0.5) * tunnelHeightRange;

      tunnelDotsPositions[i * 3] = x;
      tunnelDotsPositions[i * 3 + 1] = y;
      tunnelDotsPositions[i * 3 + 2] = z;

      tunnelDotsVelocities[i * 3] = (Math.random() - 0.5) * 0.002;
      tunnelDotsVelocities[i * 3 + 1] = 0.006 + Math.random() * 0.010;
      tunnelDotsVelocities[i * 3 + 2] = (Math.random() - 0.5) * 0.002;
    }

    tunnelDotsGeometry.setAttribute('position', new THREE.BufferAttribute(tunnelDotsPositions, 3));
    const tunnelDotsMaterial = new THREE.PointsMaterial({
      color: 0xcccccc,
      size: 0.045,
      transparent: true,
      opacity: 0.65,
      depthWrite: false
    });
    const tunnelDotsMesh = new THREE.Points(tunnelDotsGeometry, tunnelDotsMaterial);
    scene.add(tunnelDotsMesh);

    // 4. Trofeo central 3D
    let trophyMesh = null;
    const gltfLoader = new THREE.GLTFLoader();
    gltfLoader.load('trofeo.glb', (gltf) => {
      trophyMesh = gltf.scene;
      const box = new THREE.Box3().setFromObject(trophyMesh);
      const center = box.getCenter(new THREE.Vector3());
      const size = box.getSize(new THREE.Vector3());

      trophyMesh.position.sub(center);
      const maxAxis = Math.max(size.x, size.y, size.z);
      if (maxAxis > 0) trophyMesh.scale.setScalar(2.6 / maxAxis);

      trophyMesh.traverse((child) => {
        if (child.isMesh) {
          child.geometry.computeVertexNormals();
          child.material = new THREE.MeshStandardMaterial({
            color: new THREE.Color('#f0c441'),
            metalness: 1.0,
            roughness: 0.12,
            envMapIntensity: 2.5
          });
        }
      });
      scene.add(trophyMesh);
    });

    // 5. Cilindro interactivo
    const tubeGroup = new THREE.Group();
    scene.add(tubeGroup);

    const rows = 7;
    const cols = 12;
    const radius = 4.3;
    const rowHeight = 1.6;
    const totalHeight = rows * rowHeight;
    const cardSize = 1.25;
    const cardGeometry = new THREE.PlaneGeometry(cardSize, cardSize);

    const interactiveMeshes = [];
    const textureLoader = new THREE.TextureLoader();

    const cachedMaterials = projectData.map(proj => {
      const tex = textureLoader.load(proj.image);
      tex.encoding = THREE.sRGBEncoding;
      tex.wrapS = THREE.RepeatWrapping;
      tex.repeat.x = -1;
      return new THREE.MeshBasicMaterial({ map: tex, side: THREE.DoubleSide });
    });

    let itemIndex = 0;
    for (let r = 0; r < rows; r++) {
      const baseY = (r - (rows - 1) / 2) * rowHeight;

      for (let c = 0; c < cols; c++) {
        const angle = (c / cols) * Math.PI * 2;
        const x = Math.sin(angle) * radius;
        const z = Math.cos(angle) * radius;

        let projIndex = null;

        if (r === 3) {
          projIndex = c;
        } else if (r === 4) {
          projIndex = 12 + c;
        } else if (r === 2) {
          projIndex = 24 + c;
        } else if (r === 1) {
          if (c === 0) projIndex = 36;
          else if (c === 1) projIndex = 37;
          else projIndex = (c - 2) % projectData.length;
        } else {
          projIndex = itemIndex % projectData.length;
        }

        const mat = cachedMaterials[projIndex];
        const card = new THREE.Mesh(cardGeometry, mat);
        card.position.set(x, baseY, z);
        card.lookAt(0, baseY, 0);

        card.userData = { 
          index: itemIndex, 
          projectIndex: projIndex,
          baseY: baseY 
        };

        tubeGroup.add(card);
        interactiveMeshes.push(card);
        itemIndex++;
      }
    }

    // 6. Navegación e Interacción (Ratón + Táctil Móvil)
    let targetRotationY = 0;
    let targetTubeY = 0;
    let isHovered = false;
    let isModalOpen = false;
    let hoveredCard = null;

    let isDragging = false;
    let prevMouseX = 0;
    let prevMouseY = 0;

    let isTouching = false;
    let touchStartX = 0;
    let touchStartY = 0;
    let prevTouchX = 0;
    let prevTouchY = 0;
    let touchMoved = false;

    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2(0, 0);

    function pickCardAt(clientX, clientY) {
      mouse.x = (clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(interactiveMeshes);
      if (intersects.length > 0) {
        const obj = intersects[0].object;
        if (obj.userData.projectIndex !== null && projectData[obj.userData.projectIndex]) {
          openModal(projectData[obj.userData.projectIndex]);
        }
      }
    }

    // Eventos Ratón (Ordenador)
    window.addEventListener('mousedown', (e) => {
      if (isModalOpen) return;
      if (e.target.closest('.main-nav')) return;
      isDragging = true;
      prevMouseX = e.clientX;
      prevMouseY = e.clientY;
    });

    window.addEventListener('mouseup', () => { isDragging = false; });
    window.addEventListener('mouseleave', () => { isDragging = false; });

    window.addEventListener('mousemove', (e) => {
      if (isModalOpen) return;

      if (isDragging) {
        const deltaX = e.clientX - prevMouseX;
        const deltaY = e.clientY - prevMouseY;
        targetRotationY += deltaX * 0.005;
        targetTubeY -= deltaY * 0.008;
        prevMouseX = e.clientX;
        prevMouseY = e.clientY;
      }

      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(interactiveMeshes);

      if (intersects.length > 0 && !e.target.closest('.main-nav')) {
        isHovered = true;
        document.body.style.cursor = 'pointer';
        const currentCard = intersects[0].object;
        if (hoveredCard !== currentCard) {
          if (hoveredCard) hoveredCard.scale.set(1, 1, 1);
          hoveredCard = currentCard;
          hoveredCard.scale.set(1.08, 1.08, 1.08);
        }
      } else {
        isHovered = false;
        document.body.style.cursor = 'default';
        if (hoveredCard) {
          hoveredCard.scale.set(1, 1, 1);
          hoveredCard = null;
        }
      }
    });

    window.addEventListener('wheel', (event) => {
      if (isModalOpen) return;
      targetRotationY += event.deltaY * 0.0022;
      targetTubeY += event.deltaY * 0.004;
    }, { passive: true });

    window.addEventListener('click', (e) => {
      if (isModalOpen) return;
      if (e.target.closest('.main-nav')) return;
      pickCardAt(e.clientX, e.clientY);
    });

    // Eventos Táctiles (Móvil / Tablet)
    container.addEventListener('touchstart', (e) => {
      if (isModalOpen) return;
      if (e.touches.length === 1) {
        isTouching = true;
        touchMoved = false;
        touchStartX = prevTouchX = e.touches[0].clientX;
        touchStartY = prevTouchY = e.touches[0].clientY;
        mouse.x = (touchStartX / window.innerWidth) * 2 - 1;
        mouse.y = -(touchStartY / window.innerHeight) * 2 + 1;
      }
    }, { passive: true });

    container.addEventListener('touchmove', (e) => {
      if (isModalOpen || !isTouching) return;
      if (e.touches.length === 1) {
        const curX = e.touches[0].clientX;
        const curY = e.touches[0].clientY;
        const deltaX = curX - prevTouchX;
        const deltaY = curY - prevTouchY;

        if (Math.hypot(curX - touchStartX, curY - touchStartY) > 8) {
          touchMoved = true;
        }

        // Sensibilidad ampliada en móvil para girar y desplazarse arriba/abajo con fluidez
        targetRotationY += deltaX * 0.009;
        targetTubeY -= deltaY * 0.016;

        mouse.x = (curX / window.innerWidth) * 2 - 1;
        mouse.y = -(curY / window.innerHeight) * 2 + 1;

        prevTouchX = curX;
        prevTouchY = curY;
      }
    }, { passive: true });

    container.addEventListener('touchend', (e) => {
      if (isModalOpen) return;
      if (isTouching && !touchMoved && e.changedTouches.length > 0) {
        const touch = e.changedTouches[0];
        pickCardAt(touch.clientX, touch.clientY);
      }
      isTouching = false;
    }, { passive: true });

    // 7. Modal
    const modalOverlay = document.getElementById('modal-overlay');
    function openModal(data) {
      isModalOpen = true;
      document.body.style.cursor = 'default';
      document.getElementById('modal-image').src = data.image;
      document.getElementById('modal-title').textContent = data.title;
      document.getElementById('modal-subtitle').textContent = `${data.clientYear} // ${data.agency}`;
      
      const awardsList = document.getElementById('modal-awards');
      awardsList.innerHTML = '';
      data.awards.forEach(award => {
        const li = document.createElement('li');
        li.textContent = award;
        awardsList.appendChild(li);
      });

      modalOverlay.style.display = 'flex';
      setTimeout(() => { modalOverlay.style.opacity = '1'; }, 10);
    }

    function closeModal() {
      modalOverlay.style.opacity = '0';
      setTimeout(() => { 
        modalOverlay.style.display = 'none'; 
        isModalOpen = false;
      }, 350);
    }

    document.getElementById('modal-close').addEventListener('click', closeModal);
    modalOverlay.addEventListener('click', (e) => {
      if (e.target === modalOverlay) closeModal();
    });

    // 8. Bucle de Animación
    const tPositions = tunnelDotsGeometry.attributes.position.array;

    function animate() {
      requestAnimationFrame(animate);

      const halfHeight = tunnelHeightRange / 2;
      for (let i = 0; i < tunnelDotsCount; i++) {
        const i3 = i * 3;

        tPositions[i3 + 1] += tunnelDotsVelocities[i3 + 1];
        if (tPositions[i3 + 1] > halfHeight) {
          tPositions[i3 + 1] = -halfHeight;
        }

        const curX = tPositions[i3];
        const curZ = tPositions[i3 + 2];
        const cosAngle = Math.cos(0.003);
        const sinAngle = Math.sin(0.003);
        tPositions[i3] = curX * cosAngle - curZ * sinAngle;
        tPositions[i3 + 2] = curX * sinAngle + curZ * cosAngle;
      }
      tunnelDotsGeometry.attributes.position.needsUpdate = true;

      if (!isModalOpen) {
        if (!isHovered && !isDragging && !isTouching) {
          targetRotationY += 0.0016;
        }

        tubeGroup.rotation.y += (targetRotationY - tubeGroup.rotation.y) * 0.07;
        tubeGroup.position.y += (targetTubeY - tubeGroup.position.y) * 0.07;

        const halfSpan = totalHeight / 2;
        interactiveMeshes.forEach(mesh => {
          let worldY = mesh.userData.baseY + tubeGroup.position.y;
          while (worldY > halfSpan) {
            mesh.userData.baseY -= totalHeight;
            worldY = mesh.userData.baseY + tubeGroup.position.y;
          }
          while (worldY < -halfSpan) {
            mesh.userData.baseY += totalHeight;
            worldY = mesh.userData.baseY + tubeGroup.position.y;
          }
          mesh.position.y = mesh.userData.baseY;
          mesh.lookAt(0, mesh.position.y, 0);
        });

        if (trophyMesh) {
          trophyMesh.rotation.y += 0.004;

          const targetTiltX = mouse.y * 0.35;
          const targetTiltZ = -mouse.x * 0.35;
          trophyMesh.rotation.x += (targetTiltX - trophyMesh.rotation.x) * 0.08;
          trophyMesh.rotation.z += (targetTiltZ - trophyMesh.rotation.z) * 0.08;
        }
      }

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.position.z = window.innerWidth <= 768 ? 10.2 : 8.5;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
