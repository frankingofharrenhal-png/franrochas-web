<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hover Test</title>
    <style>
        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .box {
            width: 400px;
            height: 400px;
            overflow: hidden;
            cursor: pointer;
            border: 2px solid #333;
        }
        .box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(100%);
            transition: filter 0.3s ease, transform 0.3s ease;
        }
        .box:hover img {
            filter: grayscale(0%);
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="box">
        <img src="EVENTOPLUS AWARDS_2012_1.jpg" alt="Test">
    </div>
</body>
</html>
