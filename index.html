    <script>
        const video = document.getElementById('heroVideo');
        video.src = window.innerWidth <= 768 ? 'HOME_MOBILE.mp4' : 'HOME WEB.mp4';
        video.load();
        video.pause();

        let targetTime = 0;
        let currentTime = 0;
        let isSeeking = false;
        let userInteracted = false;
        let autoDirection = 1;
        let touchStartX = 0;
        let touchStartProgress = 0;

        function setProgressFromClientX(clientX) {
            if (!video.duration || isNaN(video.duration)) return;
            userInteracted = true;
            const progress = Math.max(0, Math.min(clientX / window.innerWidth, 1));
            targetTime = progress * video.duration;
        }

        // Control ordenador (ratón)
        window.addEventListener('mousemove', (e) => {
            setProgressFromClientX(e.clientX);
        }, { passive: true });

        // Desbloquear decodificador de vídeo en iOS/Android al primer toque
        function primeMobileVideo() {
            video.play().then(() => video.pause()).catch(() => {});
        }

        // Control móvil (arrastre relativo sensible con el dedo)
        window.addEventListener('touchstart', (e) => {
            if (e.target.closest('.main-nav')) return;
            primeMobileVideo();
            if (e.touches.length > 0 && video.duration) {
                userInteracted = true;
                touchStartX = e.touches[0].clientX;
                touchStartProgress = currentTime / video.duration;
            }
        }, { passive: true });

        window.addEventListener('touchmove', (e) => {
            if (e.target.closest('.main-nav')) return;
            if (e.touches.length > 0 && video.duration) {
                userInteracted = true;
                const deltaX = e.touches[0].clientX - touchStartX;
                const deltaProgress = (deltaX / window.innerWidth) * 1.45;
                const newProgress = Math.max(0, Math.min(touchStartProgress + deltaProgress, 1));
                targetTime = newProgress * video.duration;
            }
        }, { passive: true });

        function updateVideoScrub() {
            if (video.duration && !isNaN(video.duration)) {
                if (!userInteracted && window.innerWidth <= 768) {
                    targetTime += 0.016 * autoDirection;
                    if (targetTime >= video.duration - 0.1) {
                        targetTime = video.duration - 0.1;
                        autoDirection = -1;
                    } else if (targetTime <= 0.1) {
                        targetTime = 0.1;
                        autoDirection = 1;
                    }
                }

                const easeFactor = window.innerWidth <= 768 ? 0.22 : 0.12;
                currentTime += (targetTime - currentTime) * easeFactor;

                if (Math.abs(video.currentTime - currentTime) > 0.02 && !isSeeking) {
                    isSeeking = true;
                    video.currentTime = currentTime;
                }
            }

            requestAnimationFrame(updateVideoScrub);
        }

        video.addEventListener('seeked', () => {
            isSeeking = false;
        });

        video.addEventListener('loadedmetadata', () => {
            video.currentTime = 0.01;
            requestAnimationFrame(updateVideoScrub);
        });

        if (video.readyState >= 1) {
            requestAnimationFrame(updateVideoScrub);
        }
    </script>

    <script>
        (function() {
            const heroVideo = document.getElementById('heroVideo') || document.querySelector('video:not(#reel-video-player)');
            const zone = document.getElementById('face-reel-zone');
            const canvas = document.getElementById('face-pixel-canvas');
            const ctx = canvas.getContext('2d', { willReadFrequently: true });
            const label = document.getElementById('face-reel-label');
            const modal = document.getElementById('reel-modal');
            const reelStage = document.getElementById('reel-stage');
            const transCanvas = document.getElementById('reel-transition-canvas');
            const transCtx = transCanvas.getContext('2d');
            const reelPlayer = document.getElementById('reel-video-player');
            const closeBtn = document.getElementById('close-reel-btn');
            const playToggle = document.getElementById('reel-play-toggle');
            const muteToggle = document.getElementById('reel-mute-toggle');
            const timecodeEl = document.getElementById('reel-timecode');
            const progressWrap = document.getElementById('reel-progress-wrap');
            const progressFill = document.getElementById('reel-progress-fill');

            const offCanvas = document.createElement('canvas');
            const offCtx = offCanvas.getContext('2d', { willReadFrequently: true });

            let isHovered = false;
            let animId = null;
            let scrambleTimer = null;
            const targetWord = 'REEL';
            const glyphs = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';

            function scrambleText() {
                let step = 0;
                clearInterval(scrambleTimer);
                scrambleTimer = setInterval(() => {
                    label.textContent = targetWord.split('').map((ch, idx) => {
                        if (idx < step) return ch;
                        return glyphs[Math.floor(Math.random() * glyphs.length)];
                    }).join('');
                    step += 0.35;
                    if (step >= targetWord.length) {
                        label.textContent = targetWord;
                        clearInterval(scrambleTimer);
                    }
                }, 35);
            }

            function renderAnimatedPixels(timestamp) {
                if (!isHovered && window.innerWidth > 768) {
                    animId = null;
                    return;
                }

                const rect = zone.getBoundingClientRect();
                if (rect.width === 0 || rect.height === 0) {
                    animId = requestAnimationFrame(renderAnimatedPixels);
                    return;
                }
                if (canvas.width !== Math.round(rect.width) || canvas.height !== Math.round(rect.height)) {
                    canvas.width = Math.round(rect.width);
                    canvas.height = Math.round(rect.height);
                }

                const pulse = (Math.sin(timestamp * 0.0055) + 1) * 0.5;
                const blockSize = Math.round(14 + pulse * 11);

                const cols = Math.max(4, Math.floor(canvas.width / blockSize));
                const rows = Math.max(4, Math.floor(canvas.height / blockSize));
                offCanvas.width = cols;
                offCanvas.height = rows;

                const bgVideo = heroVideo || document.querySelector('video:not(#reel-video-player)');
                let drewFromVideo = false;

                if (bgVideo && bgVideo.readyState >= 2 && bgVideo.videoWidth > 0) {
                    try {
                        const vw = bgVideo.videoWidth;
                        const vh = bgVideo.videoHeight;
                        const winW = window.innerWidth;
                        const winH = window.innerHeight;

                        const scale = Math.max(winW / vw, winH / vh);
                        const renderedW = vw * scale;
                        const renderedH = vh * scale;
                        const focusX = (winW <= 768) ? 0.70 : 0.5;
                        const offsetX = (winW - renderedW) * focusX;
                        const offsetY = (winH - renderedH) * 0.5;

                        const sx = Math.max(0, (rect.left - offsetX) / scale);
                        const sy = Math.max(0, (rect.top - offsetY) / scale);
                        const sw = Math.min(vw - sx, rect.width / scale);
                        const sh = Math.min(vh - sy, rect.height / scale);

                        offCtx.drawImage(bgVideo, sx, sy, sw, sh, 0, 0, cols, rows);
                        const imgData = offCtx.getImageData(0, 0, cols, rows);
                        const data = imgData.data;

                        for (let i = 0; i < data.length; i += 4) {
                            const jitter = (Math.sin(timestamp * 0.01 + i) * 14);
                            data[i] = Math.min(255, Math.max(0, data[i] + jitter));
                            data[i + 1] = Math.min(255, Math.max(0, data[i + 1] + jitter));
                            data[i + 2] = Math.min(255, Math.max(0, data[i + 2] + jitter));
                        }
                        offCtx.putImageData(imgData, 0, 0);

                        ctx.imageSmoothingEnabled = false;
                        ctx.clearRect(0, 0, canvas.width, canvas.height);
                        ctx.drawImage(offCanvas, 0, 0, cols, rows, 0, 0, canvas.width, canvas.height);
                        drewFromVideo = true;
                    } catch (e) {}
                }

                if (!drewFromVideo) {
                    // Paleta cálida/sombreada real del rostro mientras arranca el vídeo en móvil
                    const faceTones = [
                        [142, 108, 92], [112, 84, 72], [174, 138, 118],
                        [68, 54, 48], [42, 36, 36], [196, 162, 140]
                    ];
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    for (let r = 0; r < rows; r++) {
                        for (let c = 0; c < cols; c++) {
                            const idx = (r * 7 + c * 3 + Math.floor(timestamp * 0.004)) % faceTones.length;
                            const t = faceTones[idx];
                            ctx.fillStyle = `rgb(${t[0]}, ${t[1]}, ${t[2]})`;
                            ctx.fillRect(c * blockSize, r * blockSize, blockSize, blockSize);
                        }
                    }
                }

                animId = requestAnimationFrame(renderAnimatedPixels);
            }

            function activateZone() {
                if (isHovered) return;
                isHovered = true;
                zone.classList.add('is-active');
                scrambleText();
                cancelAnimationFrame(animId);
                animId = requestAnimationFrame(renderAnimatedPixels);
            }

            function deactivateZone() {
                if (window.innerWidth <= 768) return;
                isHovered = false;
                zone.classList.remove('is-active');
                cancelAnimationFrame(animId);
            }

            zone.addEventListener('mouseenter', activateZone);
            zone.addEventListener('mouseleave', deactivateZone);

            function syncMobileState() {
                if (window.innerWidth <= 768) {
                    zone.classList.add('is-active');
                    cancelAnimationFrame(animId);
                    animId = requestAnimationFrame(renderAnimatedPixels);
                } else if (!isHovered) {
                    zone.classList.remove('is-active');
                    cancelAnimationFrame(animId);
                }
            }
            window.addEventListener('resize', syncMobileState);
            syncMobileState();

            // Animación de barrido pixelado con muestreo real del fotograma activo
            const transSampleCanvas = document.createElement('canvas');
            const transSampleCtx = transSampleCanvas.getContext('2d', { willReadFrequently: true });

            function sampleVideoColors(videoEl, cols, rows, fallbackPalette) {
                transSampleCanvas.width = cols;
                transSampleCanvas.height = rows;
                try {
                    if (videoEl && videoEl.readyState >= 2 && videoEl.videoWidth > 0) {
                        transSampleCtx.drawImage(videoEl, 0, 0, cols, rows);
                        const data = transSampleCtx.getImageData(0, 0, cols, rows).data;
                        // Verificar que no sea un fotograma vacío/negro total
                        let sum = 0;
                        for (let i = 0; i < data.length; i += 16) {
                            sum += data[i] + data[i + 1] + data[i + 2];
                        }
                        if (sum > 80) return data;
                    }
                } catch (e) {}
                return null;
            }

            function runPixelTransition(isOpening, onComplete) {
                const rect = reelStage.getBoundingClientRect();
                transCanvas.width = Math.max(320, Math.round(rect.width));
                transCanvas.height = Math.max(180, Math.round(rect.height));

                const block = 32;
                const cols = Math.ceil(transCanvas.width / block);
                const rows = Math.ceil(transCanvas.height / block);

                // Paleta dorada del águila sobre la pantalla de agua (apertura) y escena activa (cierre)
                const eagleWaterPalette = [
                    [245, 194, 36],   // Dorado brillante del águila
                    [218, 128, 12],   // Ámbar luminoso
                    [148, 84, 10],    // Reflejo oro en el agua
                    [255, 224, 92],   // Destello alto
                    [10, 22, 34],     // Azul noche del fondo
                    [18, 36, 48]      // Agua oscura
                ];

                // Muestreamos siempre reelPlayer (al abrir toma el águila dorada del inicio; al cerrar el fotograma actual)
                const pixelData = sampleVideoColors(reelPlayer, cols, rows, eagleWaterPalette);

                const cells = [];
                for (let r = 0; r < rows; r++) {
                    for (let c = 0; c < cols; c++) {
                        let rCol, gCol, bCol;
                        if (pixelData) {
                            const idx = (r * cols + c) * 4;
                            rCol = Math.min(255, Math.round(pixelData[idx] * 1.2));
                            gCol = Math.min(255, Math.round(pixelData[idx + 1] * 1.15));
                            bCol = Math.min(255, Math.round(pixelData[idx + 2] * 1.1));
                        } else {
                            // Distribución orgánica con el arco dorado del águila en el centro-izquierda y agua oscura alrededor
                            const nx = c / cols;
                            const ny = r / rows;
                            const inEagleArc = (nx > 0.12 && nx < 0.65 && ny > 0.22 && ny < 0.72);
                            const p = inEagleArc
                                ? eagleWaterPalette[Math.floor(Math.random() * 4)]
                                : eagleWaterPalette[4 + Math.floor(Math.random() * 2)];
                            rCol = p[0]; gCol = p[1]; bCol = p[2];
                        }
                        cells.push({
                            x: c * block,
                            y: r * block,
                            threshold: Math.random(),
                            color: `rgb(${rCol}, ${gCol}, ${bCol})`
                        });
                    }
                }

                const duration = 620;
                const startTime = performance.now();

                function step(now) {
                    const t = Math.min(1, (now - startTime) / duration);
                    transCtx.clearRect(0, 0, transCanvas.width, transCanvas.height);

                    for (let i = 0; i < cells.length; i++) {
                        const cell = cells[i];
                        const visible = isOpening ? (cell.threshold > t) : (cell.threshold <= t);
                        if (visible) {
                            transCtx.fillStyle = cell.color;
                            transCtx.fillRect(cell.x, cell.y, block, block);
                        }
                    }

                    if (t < 1) {
                        requestAnimationFrame(step);
                    } else {
                        if (isOpening) transCtx.clearRect(0, 0, transCanvas.width, transCanvas.height);
                        if (onComplete) onComplete();
                    }
                }
                requestAnimationFrame(step);
            }

            function formatTime(sec) {
                if (!isFinite(sec)) return '00:00';
                const m = Math.floor(sec / 60);
                const s = Math.floor(sec % 60);
                return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
            }

            reelPlayer.addEventListener('timeupdate', () => {
                const pct = reelPlayer.duration ? (reelPlayer.currentTime / reelPlayer.duration) * 100 : 0;
                progressFill.style.width = pct + '%';
                timecodeEl.textContent = formatTime(reelPlayer.currentTime) + ' / ' + formatTime(reelPlayer.duration);
            });

            reelPlayer.addEventListener('ended', () => {
                playToggle.textContent = 'REPLAY';
            });

            function togglePlay() {
                if (reelPlayer.paused) {
                    reelPlayer.play();
                    playToggle.textContent = 'PAUSE';
                } else {
                    reelPlayer.pause();
                    playToggle.textContent = 'PLAY';
                }
            }

            playToggle.addEventListener('click', togglePlay);
            reelPlayer.addEventListener('click', togglePlay);

            muteToggle.addEventListener('click', () => {
                reelPlayer.muted = !reelPlayer.muted;
                muteToggle.textContent = reelPlayer.muted ? 'MUTED' : 'SOUND ON';
            });

            progressWrap.addEventListener('click', (e) => {
                const rect = progressWrap.getBoundingClientRect();
                const ratio = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
                if (reelPlayer.duration) {
                    reelPlayer.currentTime = ratio * reelPlayer.duration;
                }
            });

            function openReel() {
                modal.classList.add('open');
                modal.setAttribute('aria-hidden', 'false');
                reelPlayer.currentTime = 0;
                reelPlayer.muted = false;
                muteToggle.textContent = 'SOUND ON';
                playToggle.textContent = 'PAUSE';

                let started = false;
                const startOpeningReveal = () => {
                    if (started) return;
                    started = true;
                    runPixelTransition(true);
                };

                reelPlayer.addEventListener('playing', startOpeningReveal, { once: true });
                reelPlayer.play().catch(() => {
                    reelPlayer.muted = true;
                    muteToggle.textContent = 'MUTED';
                    reelPlayer.play().catch(() => {});
                });
                setTimeout(startOpeningReveal, 140);
            }

            function closeReel() {
                runPixelTransition(false, () => {
                    reelPlayer.pause();
                    modal.classList.remove('open');
                    modal.setAttribute('aria-hidden', 'true');
                });
            }

            zone.addEventListener('click', openReel);
            closeBtn.addEventListener('click', closeReel);
            modal.addEventListener('click', (e) => {
                if (e.target === modal) closeReel();
            });
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && modal.classList.contains('open')) closeReel();
                if (e.key === ' ' && modal.classList.contains('open')) {
                    e.preventDefault();
                    togglePlay();
                }
            });
        })();
    </script>

<div id="fr-face-reel-btn" role="button" aria-label="Play Reel">

</div>

<script>
(function() {
    const btn = document.getElementById('fr-face-reel-btn');
    const canvas = document.getElementById('fr-face-canvas');
    const box = document.getElementById('fr-reel-lightbox');
    const vid = document.getElementById('fr-reel-player');
    const closeBtn = document.getElementById('fr-reel-close');
    const tCanvas = document.getElementById('fr-reel-trans-canvas');
    const bgVid = document.getElementById('heroVideo');
    if (!btn || !canvas || !box || !vid || !closeBtn || !tCanvas) return;

    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const off = document.createElement('canvas');
    const offCtx = off.getContext('2d', { willReadFrequently: true });
    const tCtx = tCanvas.getContext('2d');
    const goldPalette = ['#D4AF37', '#B8860B', '#F3E5AB', '#8B6508', '#1A1405', '#E5C158'];
    let lastOpen = 0;

    function drawFrame(ts) {
        if (bgVid && bgVid.readyState >= 2 && bgVid.videoWidth > 0) {
            const rect = btn.getBoundingClientRect();
            const w = Math.max(10, Math.round(rect.width));
            const h = Math.max(10, Math.round(rect.height));
            if (canvas.width !== w || canvas.height !== h) {
                canvas.width = w;
                canvas.height = h;
            }
            const pulse = (Math.sin(ts * 0.0032) + 1) * 0.5;
            const block = Math.round(14 + pulse * 6);
            const cols = Math.max(4, Math.floor(w / block));
            const rows = Math.max(4, Math.floor(h / block));
            off.width = cols;
            off.height = rows;
            try {
                const vw = bgVid.videoWidth, vh = bgVid.videoHeight;
                const winW = window.innerWidth, winH = window.innerHeight;
                const scale = Math.max(winW / vw, winH / vh);
                const rW = vw * scale, rH = vh * scale;
                const fx = winW <= 768 ? 0.70 : 0.5;
                const ox = (winW - rW) * fx, oy = (winH - rH) * 0.5;
                const sx = Math.max(0, (rect.left - ox) / scale);
                const sy = Math.max(0, (rect.top - oy) / scale);
                offCtx.drawImage(bgVid, sx, sy, Math.min(vw - sx, w / scale), Math.min(vh - sy, h / scale), 0, 0, cols, rows);
                const img = offCtx.getImageData(0, 0, cols, rows);
                const d = img.data;
                for (let i = 0; i < d.length; i += 4) {
                    const j = Math.sin(ts * 0.006 + i * 0.25) * 10;
                    d[i] = Math.min(255, Math.max(0, d[i] + j));
                    d[i + 1] = Math.min(255, Math.max(0, d[i + 1] + j));
                    d[i + 2] = Math.min(255, Math.max(0, d[i + 2] + j));
                }
                offCtx.putImageData(img, 0, 0);
                ctx.imageSmoothingEnabled = false;
                ctx.clearRect(0, 0, w, h);
                ctx.drawImage(off, 0, 0, cols, rows, 0, 0, w, h);
            } catch (e) {}
        }
        requestAnimationFrame(drawFrame);
    }

    function playPixelWipe(mode, onDone) {
        tCanvas.width = window.innerWidth;
        tCanvas.height = window.innerHeight;
        tCanvas.style.display = 'block';
        const size = window.innerWidth <= 768 ? 28 : 42;
        const cols = Math.ceil(tCanvas.width / size);
        const rows = Math.ceil(tCanvas.height / size);
        const cells = [];
        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
                cells.push({ x: c * size, y: r * size, color: goldPalette[(r * 7 + c * 13) % goldPalette.length], order: Math.random() });
            }
        }
        const start = performance.now();
        function step(now) {
            const p = Math.min(1, (now - start) / 420);
            tCtx.clearRect(0, 0, tCanvas.width, tCanvas.height);
            for (let i = 0; i < cells.length; i++) {
                const cell = cells[i];
                if (mode === 'open' ? (p < 1 - cell.order * 0.85) : (p > cell.order * 0.85)) {
                    tCtx.fillStyle = cell.color;
                    tCtx.fillRect(cell.x, cell.y, size + 1, size + 1);
                }
            }
            if (p < 1) requestAnimationFrame(step);
            else {
                tCtx.clearRect(0, 0, tCanvas.width, tCanvas.height);
                tCanvas.style.display = 'none';
                if (onDone) onDone();
            }
        }
        requestAnimationFrame(step);
    }

    function launchReel(e) {
        if (e) { e.preventDefault(); e.stopPropagation(); e.stopImmediatePropagation(); }
        if (Date.now() - lastOpen < 500) return;
        lastOpen = Date.now();
        if (bgVid) bgVid.pause();
        box.style.display = 'flex';
        vid.currentTime = 0;
        vid.muted = false;
        vid.play().catch(() => { vid.muted = true; vid.play().catch(() => {}); });
        playPixelWipe('open');
    }

    function closeReel(e) {
        if (e) { e.preventDefault(); e.stopPropagation(); }
        vid.pause();
        playPixelWipe('close', () => {
            box.style.display = 'none';
            if (bgVid) bgVid.play().catch(() => {});
        });
    }

    btn.addEventListener('pointerdown', launchReel, true);
    btn.addEventListener('click', launchReel, true);
    closeBtn.addEventListener('click', closeReel, true);
    document.addEventListener('keydown', (ev) => { if (ev.key === 'Escape' && box.style.display === 'flex') closeReel(); });
    requestAnimationFrame(drawFrame);
})();
</script>
