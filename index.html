<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fran Rochas | Home</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Syne:wght@700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #000000;
            color: #ffffff;
            font-family: 'Space Grotesk', sans-serif;
            overflow: hidden;
            cursor: ew-resize;
            touch-action: none;
        }

        /* OCULTAR POSIBLE DRAWER INYECTADO POR NETLIFY */
        iframe[src*="netlify"],
        #netlify-identity-widget,
        [data-netlify-deploy-id] {
            display: none !important;
            visibility: hidden !important;
            opacity: 0 !important;
            pointer-events: none !important;
        }

        /* TOP NAVIGATION */
        .main-nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            padding: 35px 20px 20px 20px;
            display: flex;
            justify-content: center;
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0.95) 0%, rgba(0, 0, 0, 0) 100%);
            pointer-events: auto;
            cursor: default;
        }

        .main-nav ul {
            display: flex;
            list-style: none;
            gap: 25px;
            align-items: center;
            justify-content: center;
        }

        .main-nav a {
            position: relative;
            display: inline-block;
            padding: 6px 12px;
            text-decoration: none;
            outline: none;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.80rem;
            font-weight: 500;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #ffffff;
            background: transparent;
            cursor: pointer;
            white-space: nowrap;
        }

        .main-nav a span {
            color: #ffffff;
            position: relative;
            z-index: 2;
        }

        .main-nav a:hover span,
        .main-nav a.active span {
            color: #000000;
        }

        .main-nav a::before {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 0%;
            background-color: #ffffff;
            z-index: 1;
            transition: height 0.25s ease;
        }

        .main-nav a:hover::before,
        .main-nav a.active::before {
            height: 100%;
        }

        /* BACKGROUND VIDEO WRAPPER */
        .hero-video-container {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
        }

        .hero-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            filter: brightness(0.85) contrast(1.05);
            pointer-events: none;
        }

        /* SCANLINES OVERLAY */
        .hero-overlay {
            position: absolute;
            inset: 0;
            z-index: 2;
            pointer-events: none;
            background: 
                radial-gradient(circle at center, transparent 40%, rgba(0, 0, 0, 0.8) 100%),
                repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.18) 0px, rgba(0, 0, 0, 0.18) 1px, transparent 1px, transparent 3px);
        }

        /* BRANDING */
        .hero-brand-tag {
            position: absolute;
            bottom: 35px;
            left: 40px;
            z-index: 10;
            pointer-events: none;
            cursor: default;
        }

        .brand-name {
            font-family: 'Syne', sans-serif;
            font-size: clamp(1.4rem, 2.8vw, 2.2rem);
            font-weight: 900;
            letter-spacing: -0.5px;
            text-transform: uppercase;
            color: #ffffff;
        }

        .brand-sub {
            font-family: 'Space Mono', monospace;
            font-size: 0.70rem;
            color: #00ff41;
            letter-spacing: 2px;
            text-shadow: 0 0 8px rgba(0, 255, 65, 0.7);
            margin-top: 4px;
            text-transform: uppercase;
        }

        .touch-hint {
            display: none;
        }

        @media (max-width: 768px) {
            html, body {
                height: 100dvh;
                cursor: default;
            }

            .main-nav {
                padding: 18px 10px 12px 10px;
            }

            .main-nav ul {
                flex-wrap: wrap;
                gap: 6px 8px;
                max-width: 100%;
            }

            .main-nav a {
                font-size: 0.66rem;
                letter-spacing: 1.5px;
                padding: 5px 8px;
            }

            .hero-brand-tag {
                bottom: 28px;
                left: 22px;
                right: 22px;
            }

            .brand-name {
                font-size: 1.55rem;
            }

            .brand-sub {
                font-size: 0.65rem;
                letter-spacing: 1.5px;
            }

            .touch-hint {
                display: block;
                font-family: 'Space Mono', monospace;
                font-size: 0.62rem;
                color: rgba(255, 255, 255, 0.55);
                letter-spacing: 2px;
                text-transform: uppercase;
                margin-top: 8px;
            }
        }
    
        /* DISPARADOR INTERACTIVO PIXELADO SOBRE LA CARA (REEL) */
        #face-reel-zone {
            position: fixed;
            left: 74.5%;
            top: 32.5%;
            width: 165px;
            height: 175px;
            transform: translate(-50%, -50%);
            z-index: 60;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        #face-pixel-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 0.25s ease;
            pointer-events: none;
            image-rendering: pixelated;
        }
        #face-reel-zone.is-active #face-pixel-canvas {
            opacity: 1;
        }
        #face-reel-label {
            position: relative;
            z-index: 2;
            font-family: 'Syne', sans-serif;
            font-weight: 800;
            font-size: 1.5rem;
            letter-spacing: 5px;
            color: #ffffff;
            text-shadow: 0 2px 14px rgba(0, 0, 0, 0.92), 0 0 4px rgba(0, 0, 0, 0.8);
            opacity: 0;
            transform: scale(0.94);
            transition: opacity 0.22s ease, transform 0.22s ease;
            pointer-events: none;
        }
        #face-reel-zone.is-active #face-reel-label {
            opacity: 1;
            transform: scale(1);
        }
        /* MODAL REPRODUCTOR REEL */
        #reel-modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.96);
            z-index: 9999;
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 20px;
        }
        #reel-modal.open {
            display: flex;
        }
        #reel-video-player {
            width: 100%;
            max-width: 1280px;
            max-height: 82vh;
            background: #000;
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.9);
        }
        #close-reel-btn {
            position: fixed;
            top: 24px;
            right: 28px;
            background: rgba(0, 0, 0, 0.75);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.35);
            font-family: 'Space Mono', monospace;
            font-size: 0.8rem;
            letter-spacing: 2px;
            padding: 10px 18px;
            cursor: pointer;
            z-index: 10000;
            transition: all 0.2s ease;
        }
        #close-reel-btn:hover {
            border-color: #ffffff;
            background: rgba(255, 255, 255, 0.12);
        }
        @media (max-width: 768px) {
            #face-reel-zone {
                left: 71.5%;
                top: 33%;
                width: 115px;
                height: 125px;
            }
            #face-reel-label {
                font-size: 1.15rem;
                letter-spacing: 4px;
            }
            #close-reel-btn {
                top: 16px;
                right: 16px;
                padding: 8px 14px;
            }
        }

    </style>
</head>
<body>

    <nav class="main-nav">
        <ul>
            <li><a href="index.html" class="active"><span>HOME</span></a></li>
            <li><a href="work.html"><span>WORK</span></a></li>
            <li><a href="behind-the-scenes.html"><span>BEHIND THE SCENES</span></a></li>
            <li><a href="ai-filmmaker.html"><span>A.I. FILMMAKER</span></a></li>
            <li><a href="about3D/about.html"><span>ABOUT</span></a></li>
            <li><a href="contact.html"><span>CONTACT</span></a></li>
        </ul>
    </nav>

    <div class="hero-video-container">
        <video class="hero-video" id="heroVideo" muted playsinline webkit-playsinline preload="auto">
            
        </video>
        <div class="hero-overlay"></div>
    </div>

    <div class="hero-brand-tag">
        <div class="brand-name">FRAN ROCHAS</div>
        <div class="brand-sub">Creative Director</div>
        <div class="touch-hint">&larr; SLIDE TO SCRUB &rarr;</div>
    </div>

    <script>
        const video = document.getElementById('heroVideo');
        video.src = window.innerWidth <= 768 ? 'HOME_MOBILE.mp4' : 'HOME WEB.mp4';
        video.load();
        video.pause();

        let targetTime = 0;
        let currentTime = 0;
        let isSeeking = false;
        let userInteracted = false;
        let autoDirection = 1;
        let touchStartX = 0;
        let touchStartProgress = 0;

        function setProgressFromClientX(clientX) {
            if (!video.duration || isNaN(video.duration)) return;
            userInteracted = true;
            const progress = Math.max(0, Math.min(clientX / window.innerWidth, 1));
            targetTime = progress * video.duration;
        }

        // Control ordenador (ratón)
        window.addEventListener('mousemove', (e) => {
            setProgressFromClientX(e.clientX);
        }, { passive: true });

        // Desbloquear decodificador de vídeo en iOS/Android al primer toque
        function primeMobileVideo() {
            video.play().then(() => video.pause()).catch(() => {});
        }

        // Control móvil (arrastre relativo sensible con el dedo)
        window.addEventListener('touchstart', (e) => {
            if (e.target.closest('.main-nav')) return;
            primeMobileVideo();
            if (e.touches.length > 0 && video.duration) {
                userInteracted = true;
                touchStartX = e.touches[0].clientX;
                touchStartProgress = currentTime / video.duration;
            }
        }, { passive: true });

        window.addEventListener('touchmove', (e) => {
            if (e.target.closest('.main-nav')) return;
            if (e.touches.length > 0 && video.duration) {
                userInteracted = true;
                const deltaX = e.touches[0].clientX - touchStartX;
                const deltaProgress = (deltaX / window.innerWidth) * 1.45;
                const newProgress = Math.max(0, Math.min(touchStartProgress + deltaProgress, 1));
                targetTime = newProgress * video.duration;
            }
        }, { passive: true });

        function updateVideoScrub() {
            if (video.duration && !isNaN(video.duration)) {
                if (!userInteracted && window.innerWidth <= 768) {
                    targetTime += 0.016 * autoDirection;
                    if (targetTime >= video.duration - 0.1) {
                        targetTime = video.duration - 0.1;
                        autoDirection = -1;
                    } else if (targetTime <= 0.1) {
                        targetTime = 0.1;
                        autoDirection = 1;
                    }
                }

                const easeFactor = window.innerWidth <= 768 ? 0.22 : 0.12;
                currentTime += (targetTime - currentTime) * easeFactor;

                if (Math.abs(video.currentTime - currentTime) > 0.02 && !isSeeking) {
                    isSeeking = true;
                    video.currentTime = currentTime;
                }
            }

            requestAnimationFrame(updateVideoScrub);
        }

        video.addEventListener('seeked', () => {
            isSeeking = false;
        });

        video.addEventListener('loadedmetadata', () => {
            video.currentTime = 0.01;
            requestAnimationFrame(updateVideoScrub);
        });

        if (video.readyState >= 1) {
            requestAnimationFrame(updateVideoScrub);
        }
    </script>


    <!-- ZONA INTERACTIVA SOBRE LA CARA -->
    <div id="face-reel-zone" role="button" tabindex="0" aria-label="Ver Showreel 2027">
        <canvas id="face-pixel-canvas"></canvas>
        <span id="face-reel-label">REEL</span>
    </div>

    <!-- REPRODUCTOR MODAL REEL 2027 -->
    <div id="reel-modal" aria-hidden="true">
        <button id="close-reel-btn" type="button">[ &times; CERRAR REEL ]</button>
        <video id="reel-video-player" playsinline controls preload="metadata">
            <source src="REEL_2027.mp4" type="video/mp4">
        </video>
    </div>

    <script>
        (function() {
            const heroVideo = document.getElementById('heroVideo');
            const zone = document.getElementById('face-reel-zone');
            const canvas = document.getElementById('face-pixel-canvas');
            const ctx = canvas.getContext('2d', { willReadFrequently: true });
            const label = document.getElementById('face-reel-label');
            const modal = document.getElementById('reel-modal');
            const reelPlayer = document.getElementById('reel-video-player');
            const closeBtn = document.getElementById('close-reel-btn');

            const offCanvas = document.createElement('canvas');
            const offCtx = offCanvas.getContext('2d', { willReadFrequently: true });

            let isHovered = false;
            let animId = null;
            let scrambleTimer = null;
            const targetWord = 'REEL';
            const glyphs = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';

            function scrambleText() {
                let step = 0;
                clearInterval(scrambleTimer);
                scrambleTimer = setInterval(() => {
                    label.textContent = targetWord.split('').map((ch, idx) => {
                        if (idx < step) return ch;
                        return glyphs[Math.floor(Math.random() * glyphs.length)];
                    }).join('');
                    step += 0.35;
                    if (step >= targetWord.length) {
                        label.textContent = targetWord;
                        clearInterval(scrambleTimer);
                    }
                }, 35);
            }

            function renderAnimatedPixels(timestamp) {
                if (!isHovered && window.innerWidth > 768) return;

                const rect = zone.getBoundingClientRect();
                if (canvas.width !== Math.round(rect.width) || canvas.height !== Math.round(rect.height)) {
                    canvas.width = Math.round(rect.width);
                    canvas.height = Math.round(rect.height);
                }

                // Tamaño de bloque grande animado entre 14px y 26px
                const pulse = (Math.sin(timestamp * 0.0055) + 1) * 0.5;
                const blockSize = Math.round(14 + pulse * 12);

                const cols = Math.max(4, Math.floor(canvas.width / blockSize));
                const rows = Math.max(4, Math.floor(canvas.height / blockSize));
                offCanvas.width = cols;
                offCanvas.height = rows;

                if (heroVideo && heroVideo.readyState >= 2 && heroVideo.videoWidth > 0) {
                    const vw = heroVideo.videoWidth;
                    const vh = heroVideo.videoHeight;
                    const winW = window.innerWidth;
                    const winH = window.innerHeight;

                    // Mapeo exacto considerando object-fit: cover
                    const scale = Math.max(winW / vw, winH / vh);
                    const renderedW = vw * scale;
                    const renderedH = vh * scale;
                    const offsetX = (winW - renderedW) * 0.5;
                    const offsetY = (winH - renderedH) * 0.5;

                    const sx = Math.max(0, (rect.left - offsetX) / scale);
                    const sy = Math.max(0, (rect.top - offsetY) / scale);
                    const sw = Math.min(vw - sx, rect.width / scale);
                    const sh = Math.min(vh - sy, rect.height / scale);

                    offCtx.drawImage(heroVideo, sx, sy, sw, sh, 0, 0, cols, rows);
                    const imgData = offCtx.getImageData(0, 0, cols, rows);
                    const data = imgData.data;

                    // Micro-variación orgánica usando solo los tonos reales de la cara
                    for (let i = 0; i < data.length; i += 4) {
                        const jitter = (Math.sin(timestamp * 0.01 + i) * 14);
                        data[i] = Math.min(255, Math.max(0, data[i] + jitter));
                        data[i + 1] = Math.min(255, Math.max(0, data[i + 1] + jitter));
                        data[i + 2] = Math.min(255, Math.max(0, data[i + 2] + jitter));
                    }
                    offCtx.putImageData(imgData, 0, 0);

                    ctx.imageSmoothingEnabled = false;
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    ctx.drawImage(offCanvas, 0, 0, cols, rows, 0, 0, canvas.width, canvas.height);
                }

                animId = requestAnimationFrame(renderAnimatedPixels);
            }

            function activateZone() {
                if (isHovered) return;
                isHovered = true;
                zone.classList.add('is-active');
                scrambleText();
                cancelAnimationFrame(animId);
                animId = requestAnimationFrame(renderAnimatedPixels);
            }

            function deactivateZone() {
                if (window.innerWidth <= 768) return;
                isHovered = false;
                zone.classList.remove('is-active');
                cancelAnimationFrame(animId);
            }

            zone.addEventListener('mouseenter', activateZone);
            zone.addEventListener('mouseleave', deactivateZone);

            function syncMobileState() {
                if (window.innerWidth <= 768) {
                    zone.classList.add('is-active');
                    cancelAnimationFrame(animId);
                    animId = requestAnimationFrame(renderAnimatedPixels);
                } else if (!isHovered) {
                    zone.classList.remove('is-active');
                    cancelAnimationFrame(animId);
                }
            }
            window.addEventListener('resize', syncMobileState);
            syncMobileState();

            function openReel() {
                modal.classList.add('open');
                modal.setAttribute('aria-hidden', 'false');
                reelPlayer.currentTime = 0;
                reelPlayer.play().catch(() => {});
            }

            function closeReel() {
                reelPlayer.pause();
                modal.classList.remove('open');
                modal.setAttribute('aria-hidden', 'true');
            }

            zone.addEventListener('click', openReel);
            closeBtn.addEventListener('click', closeReel);
            modal.addEventListener('click', (e) => {
                if (e.target === modal) closeReel();
            });
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && modal.classList.contains('open')) closeReel();
            });
        })();
    </script>

</body>
</html>
