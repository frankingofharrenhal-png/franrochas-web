<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fran Rochas | Contact</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Syne:wght@700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Space Grotesk', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }
        iframe[src*="netlify"],
        #netlify-identity-widget,
        [data-netlify-deploy-id] {
            display: none !important;
        }
        .main-nav {
            position: fixed; top: 0; left: 0; width: 100%; z-index: 1000;
            padding: 35px 20px 20px 20px; display: flex; justify-content: center;
            background: linear-gradient(to bottom, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0) 100%);
        }
        .main-nav ul { display: flex; list-style: none; gap: 25px; align-items: center; justify-content: center; }
        .main-nav a {
            position: relative; display: inline-block; padding: 6px 12px; text-decoration: none;
            font-size: 0.80rem; font-weight: 500; letter-spacing: 2px;
            text-transform: uppercase; color: #ffffff; white-space: nowrap;
        }
        .main-nav a span { position: relative; z-index: 2; }
        .main-nav a:hover span, .main-nav a.active span { color: #000000; }
        .main-nav a::before {
            content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 0%;
            background-color: #ffffff; z-index: 1; transition: height 0.25s ease;
        }
        .main-nav a:hover::before, .main-nav a.active::before { height: 100%; }

        .contact-container {
            min-height: 100vh; display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            padding: 140px 20px 60px 20px; max-width: 900px; margin: 0 auto;
        }
        .contact-header { text-align: center; margin-bottom: 60px; }
        .contact-title {
            font-family: 'Syne', sans-serif; font-size: 2.2rem; font-weight: 900;
            letter-spacing: 2px; text-transform: uppercase; margin-bottom: 20px;
        }
        .contact-meta {
            display: flex; gap: 30px; justify-content: center;
            font-family: 'Space Mono', monospace; font-size: 0.85rem; letter-spacing: 1px;
        }
        .contact-meta a { color: #888888; text-decoration: none; transition: color 0.2s ease; }
        .contact-meta a:hover { color: #ffffff; }

        .minimal-form { width: 100%; display: flex; flex-direction: column; gap: 35px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
        .input-group { position: relative; width: 100%; }
        .minimal-input, .minimal-textarea {
            width: 100%; background: transparent; border: none;
            border-bottom: 1px solid #2a2a2a; color: #ffffff;
            font-family: 'Space Grotesk', sans-serif; font-size: 1rem;
            padding: 12px 0; outline: none; transition: border-color 0.3s ease;
        }
        .minimal-input::placeholder, .minimal-textarea::placeholder {
            color: #444444; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px;
        }
        .minimal-input:focus, .minimal-textarea:focus { border-bottom-color: #ffffff; }
        .minimal-textarea { min-height: 110px; resize: none; }

        .form-action { display: flex; justify-content: flex-end; margin-top: 15px; }
        .btn-minimal {
            background: transparent; color: #ffffff; border: 1px solid #333333;
            font-family: 'Space Mono', monospace; font-size: 0.80rem;
            letter-spacing: 2px; text-transform: uppercase; padding: 14px 34px;
            cursor: pointer; transition: all 0.25s ease;
        }
        .btn-minimal:hover { background: #ffffff; color: #000000; border-color: #ffffff; }

        @media (max-width: 768px) {
            .main-nav { padding: 18px 10px 12px 10px; }
            .main-nav ul { flex-wrap: wrap; gap: 6px 8px; max-width: 100%; }
            .main-nav a { font-size: 0.66rem; letter-spacing: 1.5px; padding: 5px 8px; }
            .form-row { grid-template-columns: 1fr; gap: 30px; }
            .contact-meta { flex-direction: column; gap: 10px; }
        }
    </style>
</head>
<body>
    <nav class="main-nav">
        <ul>
            <li><a href="index.html"><span>HOME</span></a></li>
            <li><a href="work.html"><span>WORK</span></a></li>
            <li><a href="behind-the-scenes.html"><span>BEHIND THE SCENES</span></a></li>
            <li><a href="ai-filmmaker.html"><span>A.I. FILMMAKER</span></a></li>
            <li><a href="about3D/about.html"><span>ABOUT</span></a></li>
            <li><a href="contact.html" class="active"><span>CONTACT</span></a></li>
        </ul>
    </nav>

    <main class="contact-container">
        <header class="contact-header">
            <h1 class="contact-title">CONTACT</h1>
            <div class="contact-meta">
                <a href="mailto:hola@franrochas.com">hola@franrochas.com</a>
                <a href="https://instagram.com/franrochas_" target="_blank" rel="noopener noreferrer">IG // @franrochas_</a>
            </div>
        </header>

        <form class="minimal-form" action="mailto:hola@franrochas.com" method="POST" enctype="text/plain">
            <div class="form-row">
                <div class="input-group">
                    <input type="text" class="minimal-input" name="nombre" placeholder="Nombre *" required>
                </div>
                <div class="input-group">
                    <input type="email" class="minimal-input" name="email" placeholder="Email *" required>
                </div>
            </div>
            <div class="input-group">
                <input type="text" class="minimal-input" name="asunto" placeholder="Asunto">
            </div>
            <div class="input-group">
                <textarea class="minimal-textarea" name="mensaje" placeholder="Mensaje *" required></textarea>
            </div>
            <div class="form-action">
                <button type="submit" class="btn-minimal">ENVIAR &rarr;</button>
            </div>
        </form>
    </main>
</body>
</html>
